<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PyReplay Trader</title>
    <meta name="description"
        content="Professional bar replay trading simulator with real-time charting and backtesting.">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
</head>

<body>

    <!-- ── Top Navigation Bar ─────────────────────────── -->
    <header id="topBar">
        <div class="logo">
            <span class="logo-icon">📊</span>
            <span class="logo-text">PyReplay<span class="accent">Trader</span></span>
        </div>
        <div class="controls-group">
            <!-- <div class="control-item">
                <label for="providerSelect">Provider</label>
                <select id="providerSelect">
                    <option value="yfinance" selected>Yahoo Finance</option>
                </select>
            </div> -->
            <div class="control-item">
                <label for="symbolSelect">Symbol</label>
                <select id="symbolSelect">
                    {% for s, tf in symbols %}
                        <option value="{{ s }}" {% if s == 'EURUSD' %}selected{% endif %}>{{ s.replace('_', ' ') }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="control-item">
                <label for="timeframeSelect">Timeframe</label>
                <select id="timeframeSelect">
                    <option value="M1">M1</option>
                    <option value="M5">M5</option>
                    <option value="M15">M15</option>
                    <option value="H1" selected>H1</option>
                    <option value="H4">H4</option>
                    <option value="D1">D1</option>
                </select>
            </div>
            <button id="loadBtn" class="btn btn-primary" title="Load Data">
                <span>⟳</span> Load
            </button>
            <div class="separator"></div>
            <button id="indicatorBtn" class="btn btn-ghost" title="Indicators">
                <span>📈</span> Indicators
            </button>
        </div>
        <div class="top-right">
            <span id="connectionStatus" class="status-dot connected" title="Connected"></span>
        </div>
    </header>

    <!-- ── Main Content ───────────────────────────────── -->
    <main id="mainContent">
        <!-- Chart Area -->
        <section id="chartSection">
            <div id="chartContainer">
                <div id="chart"></div>
            </div>
            <div id="rsiContainer" class="sub-chart" style="display:none;">
                <div id="rsiChart"></div>
            </div>
            <div id="macdContainer" class="sub-chart" style="display:none;">
                <div id="macdChart"></div>
            </div>
        </section>

        <!-- ── Replay Controls ────────────────────────── -->
        <section id="replayControls">
            <div class="replay-buttons">
                <button id="jumpBackBtn" class="btn btn-icon" title="Jump to Start (Home)">⏮</button>
                <button id="stepBackBtn" class="btn btn-icon" title="Step Back (←)">◀</button>
                <button id="playPauseBtn" class="btn btn-icon btn-play" title="Play/Pause (Space)">▶</button>
                <button id="stepFwdBtn" class="btn btn-icon" title="Step Forward (→)">▶▶</button>
                <button id="jumpFwdBtn" class="btn btn-icon" title="Jump to End (End)">⏭</button>
            </div>

            <div class="speed-control">
                <label>Speed</label>
                <div class="speed-buttons">
                    <button class="btn btn-speed active" data-speed="1">1x</button>
                    <button class="btn btn-speed" data-speed="2">2x</button>
                    <button class="btn btn-speed" data-speed="5">5x</button>
                    <button class="btn btn-speed" data-speed="10">10x</button>
                </div>
            </div>

            <div class="progress-section">
                <input type="range" id="progressSlider" min="0" max="100" value="0" class="progress-slider"
                    title="Drag to jump">
                <span id="progressLabel" class="progress-label">0 / 0</span>
            </div>

            <div class="datetime-display">
                <span id="currentDatetime" class="datetime-text">--</span>
            </div>
        </section>

        <!-- ── Bottom Panels ──────────────────────────── -->
        <section id="bottomPanels">
            <!-- Stats Panel -->
            <div class="panel stats-panel">
                <h3 class="panel-title">Account</h3>
                <div class="stats-grid">
                    <div class="stat">
                        <span class="stat-label">Balance</span>
                        <span id="statBalance" class="stat-value">$10,000.00</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">Equity</span>
                        <span id="statEquity" class="stat-value">$10,000.00</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">Floating P&L</span>
                        <span id="statFloating" class="stat-value neutral">$0.00</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">Closed P&L</span>
                        <span id="statClosed" class="stat-value neutral">$0.00</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">Max Drawdown</span>
                        <span id="statDrawdown" class="stat-value">0.00%</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">Win Rate</span>
                        <span id="statWinRate" class="stat-value">0.0%</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">Total Trades</span>
                        <span id="statTrades" class="stat-value">0</span>
                    </div>
                </div>
            </div>

            <!-- Trading Panel -->
            <div class="panel trading-panel">
                <h3 class="panel-title">Trading</h3>
                <div class="trade-controls">
                    <div class="trade-inputs">
                        <div class="input-group">
                            <label for="lotSize">Lot Size</label>
                            <input type="number" id="lotSize" value="0.1" step="0.01" min="0.01">
                        </div>
                        <div class="input-group">
                            <label for="slInput">Stop Loss</label>
                            <input type="number" id="slInput" placeholder="Price" step="0.00001">
                        </div>
                        <div class="input-group">
                            <label for="tpInput">Take Profit</label>
                            <input type="number" id="tpInput" placeholder="Price" step="0.00001">
                        </div>
                    </div>
                    <div class="trade-buttons">
                        <button id="buyBtn" class="btn btn-buy" title="Buy (B)">BUY</button>
                        <button id="sellBtn" class="btn btn-sell" title="Sell (S)">SELL</button>
                        <button id="closeAllBtn" class="btn btn-close" title="Close All Positions">CLOSE ALL</button>
                    </div>
                </div>

                <!-- Open Positions -->
                <div class="positions-section">
                    <h4>Open Positions</h4>
                    <div id="openPositions" class="positions-list">
                        <span class="empty-msg">No open positions</span>
                    </div>
                </div>
            </div>

            <!-- Trade History Panel -->
            <div class="panel history-panel">
                <h3 class="panel-title">Trade History</h3>
                <div id="tradeHistory" class="history-list">
                    <span class="empty-msg">No trades yet</span>
                </div>
            </div>
        </section>
    </main>

    <!-- ── Indicator Modal ────────────────────────────── -->
    <div id="indicatorModal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Indicators</h3>
                <button id="closeModal" class="btn btn-icon">✕</button>
            </div>
            <div class="modal-body">
                <div class="indicator-item">
                    <label><input type="checkbox" id="indSMA"> SMA</label>
                    <input type="number" id="smaPeriod" value="20" min="2" max="200" class="param-input">
                </div>
                <div class="indicator-item">
                    <label><input type="checkbox" id="indEMA"> EMA</label>
                    <input type="number" id="emaPeriod" value="50" min="2" max="200" class="param-input">
                </div>
                <div class="indicator-item">
                    <label><input type="checkbox" id="indRSI"> RSI</label>
                    <input type="number" id="rsiPeriod" value="14" min="2" max="100" class="param-input">
                </div>
                <div class="indicator-item">
                    <label><input type="checkbox" id="indMACD"> MACD</label>
                    <span class="param-group">
                        <input type="number" id="macdFast" value="12" min="2" max="50" class="param-input small"
                            title="Fast">
                        <input type="number" id="macdSlow" value="26" min="2" max="100" class="param-input small"
                            title="Slow">
                        <input type="number" id="macdSignal" value="9" min="2" max="50" class="param-input small"
                            title="Signal">
                    </span>
                </div>
                <div class="indicator-item">
                    <label><input type="checkbox" id="indBB"> Bollinger Bands</label>
                    <span class="param-group">
                        <input type="number" id="bbPeriod" value="20" min="2" max="200" class="param-input small"
                            title="Period">
                        <input type="number" id="bbStd" value="2" min="0.5" max="5" step="0.5" class="param-input small"
                            title="StdDev">
                    </span>
                </div>
            </div>
            <div class="modal-footer">
                <button id="applyIndicators" class="btn btn-primary">Apply</button>
            </div>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>

</html>
