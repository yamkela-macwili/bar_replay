services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: always

  api:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - .:/app
      - ./data:/app/data
    environment:
      - FLASK_ENV=development
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=dev-secret-key-replace-in-prod
    depends_on:
      - redis
